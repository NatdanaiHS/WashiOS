<text x='850.0' y='34' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='22' fill='#111' font-weight='bold'>watchdog_gating.xml — Task(HB) ∥ Task(PL) ∥ Supervisor ∥ Iwdg ∥ Env</text>
<text x='850' y='60' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#444'>PERIOD = {500, 100} ms, DEADLINE = {1500, 800} ms, WD_POLL = 100 ms, WD_TASK = 50 ms, J = 2 ms, IWDG ∈ [1882, 2170] ms (nominal 2000; DS12589 Table 44)</text>
<text x='54' y='116' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold'>Task(id)  ×2  (TaskHealthRegistry::checkIn)</text>
<text x='200' y='186' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Running</text>
<text x='246' y='242' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#7a2e8f'>t ≤ PERIOD[id] + J</text>
<text x='520' y='186' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Stalled</text>
<text x='200' y='330' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>t ≥ PERIOD[id]</text>
<text x='200' y='346' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>t := 0, since[id] := 0, healthy[id] := true</text>
<text x='360.0' y='167' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>stall[id]?</text>
<text x='360.0' y='183' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>stalled[id] := true</text>
<text x='714' y='116' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold'>Env  (stall injector, SCENARIO 1 only)</text>
<text x='800' y='190' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Healthy</text>
<text x='1060' y='190' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Injected</text>
<text x='930.0' y='157' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>e ≥ 3000</text>
<text x='930.0' y='173' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>stall[HB]!</text>
<text x='930.0' y='292' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>e ≥ 3000</text>
<text x='930.0' y='308' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>stall[PL]!</text>
<text x='1214' y='116' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold'>Iwdg  (hardware independent watchdog)</text>
<text x='1300' y='190' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Counting</text>
<text x='1342' y='274' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#7a2e8f'>d ≤ IWDG_MAX</text>
<text x='1560' y='190' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Reset</text>
<text x='1300' y='337' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>kick?</text>
<text x='1300' y='353' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>d := 0</text>
<text x='1430.0' y='182' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>d ≥ IWDG_MIN</text>
<text x='1430.0' y='198' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>resetHappened := true</text>
<text x='54' y='421' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold'>Supervisor  (WatchdogTask → WatchdogRunner::runOnce → Watchdog::poll → TaskHealthRegistry::evaluate)</text>
<text x='620' y='510' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Polling</text>
<text x='505' y='566' text-anchor='end' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#7a2e8f'>w ≤ WD_POLL + WD_TASK + J</text>
<text x='560' y='446' text-anchor='end' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>w ≥ WD_POLL ∧ since[HB] ≤ DL[HB] ∧ since[PL] ≤ DL[PL]</text>
<text x='560' y='462' text-anchor='end' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>∧ healthy[HB] ∧ healthy[PL]</text>
<text x='560' y='478' text-anchor='end' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>kick!   (HAL_IWDG_Refresh)</text>
<text x='560' y='494' text-anchor='end' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>w := 0</text>
<text x='690' y='544' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>w ≥ WD_POLL ∧ since[id] > DL[id]  (expired, strict >)</text>
<text x='690' y='560' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>w := 0, healthy[id] := false, criticalFailed := true</text>
<text x='690' y='576' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#555' font-style='italic'>(three edges: HB only, PL only, both)</text>
<text x='620' y='660' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>w ≥ WD_POLL ∧ clocks within deadline ∧ ¬(all healthy)</text>
<text x='620' y='676' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>w := 0   (no refresh)</text>
<text x='1080' y='480' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>Refresh gate: the IWDG is kicked only on the all-healthy edge</text>
<text x='1080' y='500' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>(Watchdog.hpp:61-65). A stalled task never checks in, so once expired its</text>
<text x='1080' y='520' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>flag stays false and no further kick ever occurs (W2).</text>
<text x='1080' y='545' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#111' font-weight='bold'>Verified:</text>
<text x='1080' y='570' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>• W1  no stall ⇒ never reset, never a critical failure (SCENARIO 0)</text>
<text x='1080' y='590' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>• W3  stall detected ≤ DL + 100 + 50 + 2 = 952 ms (PL) / 1652 ms (HB), tight</text>
<text x='1080' y='610' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>• W6  stall → IWDG reset ≤ detection bound + 2170 ms</text>
<text x='1080' y='630' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>• W7  a reset never happens before a critical failure is recorded</text>
<text x='82' y='740' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#333'>guard (clock or data condition)</text>
<text x='82' y='760' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#333'>synchronisation  ch!  sender  /  ch?  receiver</text>
<text x='82' y='780' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#333'>update / clock reset</text>
<text x='82' y='800' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#333'>location invariant (time may not exceed)</text>
<text x='60' y='828' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#555'>double circle = initial location;  C = committed;  U = urgent</text>
<text x='1000' y='730' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#555'>On the G431 build the safe-fail callback only logs; the IWDG performs the reset</text>
<text x='1000' y='750' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#555'>(core/src/main.cpp:81-93). After the reset the bootloader sees WatchdogTimeout in the</text>
<text x='1000' y='770' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#555'>retained FaultLog and enters the safe loop instead of relaunching (finding F2).</text>
</svg>