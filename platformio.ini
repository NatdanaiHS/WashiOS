[env:genericSTM32F411RE]
platform = ststm32
board = genericSTM32F411RE
framework = stm32cube
extra_scripts =
    pre:scripts/hard_float_link.py
    pre:scripts/strict_cpp_flags.py

build_unflags =
    -mfloat-abi=soft
    -mfloat-abi=softfp

build_flags =
    -I include
    -I include/bsp/f4
    -I lib/FreeRTOS/include
    -I lib/FreeRTOS/portable/GCC/ARM_CM4F
    -I include/core
    -I include/rtos_config
    -I include/hal
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16

build_src_filter =
    +<*>
    -<bsp/g4/>
    -<bsp/rp2040/>
    -<bsp/esp32/>

[env:nucleo_g431rb]
platform = ststm32
board = nucleo_g431rb
framework = stm32cube
board_build.ldscript = ldscripts/STM32G431RBTX_FLASH.ld
extra_scripts =
    pre:scripts/hard_float_link.py
    pre:scripts/strict_cpp_flags.py

build_unflags =
    -mfloat-abi=soft
    -mfloat-abi=softfp

build_flags =
    -DSTM32G431xx
    -I include
    -I include/bsp/g4
    -I lib/FreeRTOS/include
    -I lib/FreeRTOS/portable/GCC/ARM_CM4F
    -I include/core
    -I include/rtos_config
    -I include/hal
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16

build_src_filter =
    +<*>
    -<bsp/f4/>
    -<bsp/rp2040/>
    -<bsp/esp32/>

upload_flags =
    -c
    reset_config none

[env:nucleo_g431rb_stress]
extends = env:nucleo_g431rb
build_flags =
    ${env:nucleo_g431rb.build_flags}
    -DWASHIOS_STRESS_TEST
    -DWASHIOS_PROFILE_CRC

[env:raspberrypi_pico]
platform = raspberrypi
board = pico
framework = arduino
extra_scripts =
    pre:scripts/strict_cpp_flags.py

build_flags =
    -DWASHIOS_TARGET_RP2040
    -I include
    -I include/bsp/rp2040
    -I include/core
    -I include/hal

build_src_filter =
    -<*>
    +<bsp/rp2040/>

[env:esp32_dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts =
    pre:scripts/strict_cpp_flags.py

build_flags =
    -DWASHIOS_TARGET_ESP32
    -I include
    -I include/bsp/esp32
    -I include/core
    -I include/hal

build_src_filter =
    -<*>
    +<bsp/esp32/>

[env:native]
platform = native
test_framework = unity
extra_scripts =
    pre:scripts/strict_cpp_flags.py
build_src_filter =
    -<*>

build_flags =
    -I include
    -I include/core
    -I include/hal
    -I test/mocks
    -DWASHIOS_ENABLE_TEST_HOOKS
