<text x='850.0' y='34' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='22' fill='#111' font-weight='bold'>payload_link.xml — network of three timed automata (Controller ∥ Payload ∥ Host)</text>
<text x='850' y='60' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#444'>Constants: P = 500 ms poll, D = 100 ms deadline, N = 3 timeouts → OFFLINE, L = 1 ms loop, J = 2 ms jitter, TX ∈ [3,4] ms serialization, d = configured delay</text>
<text x='54' y='116' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold'>Controller  (core/include/comms/PayloadLinkController.hpp, PayloadLinkTask.hpp)</text>
<text x='330' y='196' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Idle</text>
<text x='330' y='294' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#7a2e8f' font-style='italic'>xPoll ≤ P + J</text>
<text x='1100' y='196' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Awaiting</text>
<text x='1100' y='294' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#7a2e8f' font-style='italic'>xResp ≤ D + L + J</text>
<text x='715.0' y='142' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>xPoll ≥ P</text>
<text x='715.0' y='158' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>poll!</text>
<text x='715.0' y='174' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>xPoll := 0, xResp := 0</text>
<text x='715.0' y='270' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>resp_ok?</text>
<text x='715.0' y='286' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>consecutive := 0, link := ONLINE (recovery if was OFFLINE)</text>
<text x='715.0' y='342' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>xResp ≥ D  (deadline)</text>
<text x='715.0' y='358' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>consecutive++;  if consecutive = N then link := OFFLINE</text>
<text x='1212' y='232' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>resp_badcrc?</text>
<text x='1212' y='248' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>crc reject; poll stays pending</text>
<text x='218' y='232' text-anchor='end' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>resp_ok? (no poll pending)</text>
<text x='218' y='248' text-anchor='end' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>sequence reject</text>
<text x='54' y='436' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold'>Payload  (demo-payload/src/main.cpp handleRequest)</text>
<text x='300' y='516' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Ready</text>
<text x='760' y='516' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Responding</text>
<text x='530.0' y='462' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>mode ≠ SILENT</text>
<text x='530.0' y='478' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>poll?</text>
<text x='530.0' y='494' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>y := 0, pending := mode</text>
<text x='530.0' y='584' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>pending ≠ BAD_CRC ∧ y ≥ delay(pending) + TX_MIN</text>
<text x='530.0' y='600' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>resp_ok!</text>
<text x='530.0' y='657' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>pending = BAD_CRC ∧ y ≥ TX_MIN</text>
<text x='530.0' y='673' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>resp_badcrc!</text>
<text x='188' y='552' text-anchor='end' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>mode = SILENT</text>
<text x='188' y='568' text-anchor='end' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>poll?  (no response)</text>
<text x='806' y='556' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#7a2e8f'>y ≤ delay(pending) + TX_MAX</text>
<text x='560' y='690' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#555'>delay(pending) = d if pending = DELAYED, else 0</text>
<text x='1074' y='436' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold'>Host  (frozen trial protocol)</text>
<text x='1130' y='522' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Nominal</text>
<text x='1300' y='522' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Faulted</text>
<text x='1300' y='608' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#7a2e8f' font-style='italic'>z ≤ 4000</text>
<text x='1470' y='522' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Restored</text>
<text x='1470' y='608' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#7a2e8f' font-style='italic'>zr ≤ 3000</text>
<text x='1610' y='526' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Done</text>
<text x='1215.0' y='462' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>zn ≥ 2P ∧ link = ONLINE</text>
<text x='1215.0' y='478' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>inject!  mode := F, z := 0</text>
<text x='1385.0' y='632' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>z ≥ 4000</text>
<text x='1385.0' y='648' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>restore!  mode := NORMAL, zr := 0</text>
<text x='1542.0' y='497' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>zr ≥ 3000</text>
<text x='60' y='740' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#111' font-weight='bold'>Verified (UPPAAL 5.0.0, results/20260908T074838Z):</text>
<text x='60' y='766' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>• Q2  first timeout ≤ P + J + D + L + J = 605 ms after confirmed fault onset (tight)</text>
<text x='60' y='786' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>• Q3  OFFLINE ≤ 3(P + J) + D + L + J = 1609 ms (tight)</text>
<text x='60' y='806' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>• Q4  ONLINE ≤ P + J + TX_MAX = 506 ms after confirmed restoration (tight)</text>
<text x='60' y='826' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>• Q9  d ≤ 95 ms always accepted;  d ≥ 101 ms always times out;  96–100 ms undetermined under J = 2 ms</text>
<text x='60' y='846' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>• Q7  BAD_CRC: CRC reject always precedes the first timeout;  Q1: never OFFLINE while nominal</text>
<text x='1122' y='760' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#333'>guard (clock or data condition)</text>
<text x='1122' y='780' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#333'>synchronisation  ch!  sender  /  ch?  receiver</text>
<text x='1122' y='800' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#333'>update / clock reset</text>
<text x='1122' y='820' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#333'>location invariant (time may not exceed)</text>
<text x='1100' y='848' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#555'>double circle = initial location;  C = committed;  U = urgent</text>
</svg>