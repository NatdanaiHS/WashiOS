<text x='850.0' y='34' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='22' fill='#111' font-weight='bold'>boot_policy.xml — Boot ∥ App ∥ Flash  (untimed; BootPolicy::run on every reset)</text>
<text x='850' y='60' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#444'>Retained across warm resets: active, stateA, stateB ∈ {Empty, Valid, Pending, Confirmed, Bad}, bootCount, confirmedFlag, retainedCriticalFault.  MAX_UNCONFIRMED = 3.</text>
<text x='54' y='116' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold'>Boot  (bootloader/include/boot/BootPolicy.hpp run(), BootMetadata.hpp)</text>
<text x='200' y='336' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='18' fill='#2e7d32' font-weight='bold'>U</text>
<text x='200' y='286' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Start</text>
<text x='560' y='336' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='18' fill='#b35c00' font-weight='bold'>C</text>
<text x='560' y='286' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Recovered</text>
<text x='920' y='336' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='18' fill='#b35c00' font-weight='bold'>C</text>
<text x='920' y='286' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>Selecting</text>
<text x='1540' y='130' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>AppRunning</text>
<text x='1540' y='450' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='16' fill='#111' font-weight='bold'>SafeLoop</text>
<text x='380.0' y='283.0' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>¬metadataCorrupt</text>
<text x='380.0' y='299.0' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>normalizeConfirmed()</text>
<text x='740.0' y='281.0' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>¬loopLimit ∧</text>
<text x='740.0' y='297.0' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>¬retainedCriticalFault</text>
<text x='1213.1188608585753' y='192.94744776930537' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>slotBootable(active)</text>
<text x='1213.1188608585753' y='208.94744776930537' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>launch(active, false)</text>
<text x='1250.191270204713' y='367.70582995172146' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>¬slotBootable(active) ∧ slotBootable(other)</text>
<text x='1250.191270204713' y='383.70582995172146' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#c00000' font-style='italic'>active := other; launch(active, true)   —   bootCount NOT reset: finding F4</text>
<text x='1221.489328891822' y='432.5533555408912' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>¬slotBootable(active) ∧ ¬slotBootable(other)</text>
<text x='1221.489328891822' y='448.5533555408912' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>fail(NO_SLOT)</text>
<text x='1000' y='490' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>loopLimit: state(active) = Pending ∧ bootCount > 3</text>
<text x='1000' y='506' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>retainedCriticalFault  (two edges)</text>
<text x='1000' y='522' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>fail(BOOT_LOOP)  |  fail(PRIOR_FAULT)  (finding F2)</text>
<text x='700' y='540' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#0b6e4f'>metadataCorrupt</text>
<text x='700' y='556' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>fail(FAULTLOG)</text>
<text x='857.317740657182' y='143.02540050686505' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>reset?   (warm: watchdog or software reset)</text>
<text x='857.317740657182' y='159.02540050686505' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>retained state kept</text>
<text x='844.147660665837' y='610.2365094623386' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#1a4d8f' font-weight='bold'>coldStart?   (power cycle)</text>
<text x='844.147660665837' y='626.2365094623386' text-anchor='middle' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#8a4b00'>retained state scrubbed: fault log, bootCount, flags</text>
<text x='54' y='736' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold'>App  (launched application)</text>
<text x='60' y='760' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#222'>appRunning ∧ APP_CONFIRMS = 1   →  confirmedFlag := true        (design variant only)</text>
<text x='60' y='784' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#222'>appRunning                          →  reset!  with retainedCriticalFault := true   (critical stall)</text>
<text x='60' y='808' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#222'>appRunning                          →  reset!                                                   (clean reset)</text>
<text x='60' y='832' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#a30000'>Shipped firmware never writes BootMetadata: APP_CONFIRMS = 0  (finding F1).</text>
<text x='874' y='736' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='17' fill='#333' font-weight='bold'>Flash / environment</text>
<text x='880' y='760' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#222'>appRunning ∨ safeLoop  →  imageOkA := false  |  imageOkB := false     (corruption)</text>
<text x='880' y='784' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#222'>appRunning                 →  imageOkB := true, stateB := Pending           (stage an update)</text>
<text x='880' y='808' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#222'>appRunning                 →  active := SlotB, bootCount := 0                 (switch slot)</text>
<text x='880' y='832' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#222'>appRunning ∨ safeLoop  →  coldStart!   ;   appRunning → metadataCorrupt := true</text>
<text x='60' y='915' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' fill='#111' font-weight='bold'>Verified:</text>
<text x='60' y='940' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>• B1/B2  never launch an unvalidated image or a non-bootable slot state      B3  a Pending slot is launched ≤ 4 times in a row</text>
<text x='60' y='962' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>• B4  both images bad at boot ⇝ SafeLoop      B6  retained critical fault ⇒ never relaunched before a cold start (F2)</text>
<text x='60' y='984' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='14' fill='#222'>• B7  shipped app: Pending never becomes Confirmed (F1)      B8  limit bypass reachable only via the fallback edge (F4); next warm boot is refused</text>
<text x='1262' y='925' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#333'>guard (clock or data condition)</text>
<text x='1262' y='945' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#333'>synchronisation  ch!  sender  /  ch?  receiver</text>
<text x='1262' y='965' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#333'>update / clock reset</text>
<text x='1262' y='985' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#333'>location invariant (time may not exceed)</text>
<text x='1240' y='1013' text-anchor='start' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' fill='#555'>double circle = initial location;  C = committed;  U = urgent</text>
</svg>