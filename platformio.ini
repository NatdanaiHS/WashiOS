[env:nucleo_g431rb]
platform = ststm32
board = nucleo_g431rb
framework = stm32cube
board_build.ldscript = bootloader.ld
extra_scripts =
    pre:../washios-core/scripts/hard_float_link.py
    pre:../washios-core/scripts/strict_cpp_flags.py

build_unflags =
    -mfloat-abi=soft
    -mfloat-abi=softfp

build_flags =
    -DSTM32G431xx
    -DWASHIOS_BARE_METAL
    -DWASHIOS_NO_EXCEPTIONS
    -DWASHIBOOT_DEFAULT_EXPECTED_CRC32=0x00000000UL
    -I include
    -I ../washios-core/include/core
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16

build_src_flags =
    -fno-use-cxa-atexit

upload_flags =
    -c
    reset_config none

[env:native]
platform = native
test_framework = unity
extra_scripts =
    pre:../washios-core/scripts/strict_cpp_flags.py
build_src_filter =
    -<*>
build_flags =
    -I include
    -I ../washios-core/include/core
    -DNATIVE
    -DWASHIBOOT_ENABLE_TEST_HOOKS
    -DWASHIBOOT_DEFAULT_EXPECTED_CRC32=0x00000000UL
